<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Neon Slate — Token-driven CSS design system">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="glowCyan" cx="15%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald glow -->
    <radialGradient id="glowEmerald" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="glowPurple" cx="50%" cy="110%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient (text) -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7eef8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent bar gradient -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Dot glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <rect width="1280" height="320" fill="url(#glowCyan)"/>
  <rect width="1280" height="320" fill="url(#glowEmerald)"/>
  <rect width="1280" height="320" fill="url(#glowPurple)"/>

  <!-- Border frame -->
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#1f2b3d" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#barGrad)"/>

  <!-- Eyebrow badge -->
  <g transform="translate(80, 68)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.35"/>
    <circle cx="18" cy="15" r="4" fill="#34d399" filter="url(#softGlow)"/>
    <text x="34" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2.2">DESIGN SYSTEM · v1.0</text>
  </g>

  <!-- Main title -->
  <text x="80" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2.5">
    Neon Slate
  </text>

  <!-- Tagline -->
  <text x="80" y="222" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="400" fill="#b6c4d6" letter-spacing="0.2">
    Token-Driven CSS Design System — Minimal, Dual-Theme, Zero Dependencies.
  </text>

  <!-- Bottom chips -->
  <g transform="translate(80, 258)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">
    <!-- Chip 1 -->
    <g>
      <rect x="0" y="0" width="96" height="26" rx="6" fill="#141c2a" stroke="#1f2b3d"/>
      <circle cx="14" cy="13" r="3.5" fill="#38bdf8"/>
      <text x="26" y="17" fill="#b6c4d6">16 KOMPONEN</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(108, 0)">
      <rect x="0" y="0" width="82" height="26" rx="6" fill="#141c2a" stroke="#1f2b3d"/>
      <circle cx="14" cy="13" r="3.5" fill="#34d399"/>
      <text x="26" y="17" fill="#b6c4d6">DUAL THEME</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(202, 0)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="#141c2a" stroke="#1f2b3d"/>
      <circle cx="14" cy="13" r="3.5" fill="#a78bfa"/>
      <text x="26" y="17" fill="#b6c4d6">ZERO DEPS</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(294, 0)">
      <rect x="0" y="0" width="72" height="26" rx="6" fill="#141c2a" stroke="#1f2b3d"/>
      <circle cx="14" cy="13" r="3.5" fill="#fbbf24"/>
      <text x="26" y="17" fill="#b6c4d6">~40KB</text>
    </g>
  </g>

  <!-- Decorative circuit / grid pattern right side -->
  <g transform="translate(940, 60)" opacity="0.5" stroke="#1f2b3d" stroke-width="1" fill="none">
    <rect x="0" y="0" width="260" height="200" rx="12"/>
    <line x1="0" y1="50" x2="260" y2="50"/>
    <line x1="0" y1="100" x2="260" y2="100"/>
    <line x1="0" y1="150" x2="260" y2="150"/>
    <line x1="65" y1="0" x2="65" y2="200"/>
    <line x1="130" y1="0" x2="130" y2="200"/>
    <line x1="195" y1="0" x2="195" y2="200"/>
  </g>

  <!-- Decorative glowing dots -->
  <circle cx="1005" cy="110" r="6" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="1070" cy="160" r="5" fill="#34d399" filter="url(#softGlow)"/>
  <circle cx="1135" cy="110" r="5" fill="#a78bfa" filter="url(#softGlow)"/>
  <circle cx="1200" cy="160" r="4" fill="#38bdf8" filter="url(#softGlow)"/>

  <!-- Connecting lines -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" fill="none">
    <line x1="1005" y1="110" x2="1070" y2="160"/>
    <line x1="1070" y1="160" x2="1135" y2="110"/>
    <line x1="1135" y1="110" x2="1200" y2="160"/>
  </g>
</svg>