<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Neon Slate logo">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1520"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <linearGradient id="logoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="logoBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#logoBg)"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="55.5" fill="none" stroke="#1f2b3d"/>

  <!-- Glow center -->
  <circle cx="128" cy="128" r="100" fill="url(#logoGlow)"/>

  <!-- Letter "N" stylized -->
  <path d="M 78 178 L 78 78 L 98 78 L 158 158 L 158 78 L 178 78 L 178 178 L 158 178 L 98 98 L 98 178 Z"
        fill="url(#logoStroke)" filter="url(#logoBlur)" opacity="0.55"/>
  <path d="M 78 178 L 78 78 L 98 78 L 158 158 L 158 78 L 178 78 L 178 178 L 158 178 L 98 98 L 98 178 Z"
        fill="url(#logoStroke)"/>

  <!-- Accent dot -->
  <circle cx="196" cy="66" r="7" fill="#34d399"/>

  <!-- Baseline accent bar -->
  <rect x="78" y="196" width="100" height="4" rx="2" fill="url(#logoStroke)" opacity="0.7"/>
</svg>